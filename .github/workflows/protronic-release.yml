# Komplett-Release: EDSSharp-CLI und beide GUIs in EINEM GitHub-Release.
#
# Ein gemeinsames Release sorgt dafuer, dass die stabilen "latest"-URLs
# fuer ALLE Artefakte funktionieren, z.B. fuer die CANboss-OD-Generierung:
#   https://github.com/protronic/CANopenEditor/releases/latest/download/EDSSharp-linux-x64.tar.gz
#
# Haengt sieben Artefakte an das Release:
#
#   EDSSharp-linux-x64.tar.gz       CLI, eigenstaendiges Binary (keine .NET-Installation noetig)
#   EDSSharp-win-x64.zip            dito fuer Windows
#   EDSSharp-portable.zip           CLI frameworkabhaengig (braucht .NET-8-Runtime, klein)
#   EDSEditorGUI-win-net481.zip     GUI 1 (WinForms). Windows mit .NET Framework 4.8,
#                                   unter Linux mit Mono (mono EDSEditor.exe).
#   EDSEditorGUI-win-net8.zip       GUI 1 als net8.0-windows-Build (win-x64, eigenstaendig,
#                                   keine .NET-Installation noetig; laeuft auch unter Wine).
#   EDSEditorGUI2-win-x64.zip       GUI 2 (Avalonia) fuer Windows, eigenstaendig.
#   EDSEditorGUI2-linux-x64.tar.gz  dito fuer Linux (./EDSEditorGUI2 starten).
#
# Ersetzt die frueheren getrennten Workflows edssharp-release.yml (cli-v*)
# und gui-release.yml (gui-v*). Ausloeser:
#   1. Aenderung der Marker-Datei RELEASE_TAG im Repo-Root (enthaelt den Tag)
#   2. manuell per workflow_dispatch
# Eigene Tags heissen protronic-v*, damit sie nicht mit den Upstream-
# Versions-Tags (v*.*.*, bedient release.yml) kollidieren.

name: Protronic Release (CLI + GUI)

on:
  push:
    branches:
      - "**"
    paths:
      - "RELEASE_TAG"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z.B. protronic-v4.2.3.5)"
        required: true
        default: "protronic-v4.2.3.5"

permissions:
  contents: write

jobs:
  vorpruefung:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Release-Tag bestimmen (Input > Marker-Datei)
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="$(tr -d ' \n' < RELEASE_TAG)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release-Tag: $TAG"

      # Duplikate abfangen: Existiert das Release schon (z.B. weil die
      # Marker-Datei per Merge erneut in einem Push auftaucht), werden
      # Build- und Release-Jobs gruen uebersprungen.
      - name: Pruefen ob Release bereits existiert
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release existiert bereits - nichts zu tun."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

  cli:
    # EDSSharp-Kommandozeilen-Konverter (net8.0), von Linux aus fuer beide
    # Plattformen gebaut.
    needs: vorpruefung
    if: needs.vorpruefung.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag fuer den Versionsstempel setzen (git describe im Build)
        run: git tag "${{ needs.vorpruefung.outputs.tag }}" || true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish linux-x64 (self-contained)
        run: >
          dotnet publish EDSSharp/EDSSharp.csproj -c Release -f net8.0
          -p:BuildNet8=true -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -o out/linux-x64

      - name: Publish win-x64 (self-contained)
        run: >
          dotnet publish EDSSharp/EDSSharp.csproj -c Release -f net8.0
          -p:BuildNet8=true -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o out/win-x64

      - name: Publish portable (frameworkabhaengig)
        run: >
          dotnet publish EDSSharp/EDSSharp.csproj -c Release -f net8.0
          -p:BuildNet8=true -o out/portable

      - name: Artefakte packen
        run: |
          tar -C out/linux-x64 -czf EDSSharp-linux-x64.tar.gz EDSSharp
          (cd out/win-x64 && zip -q ../../EDSSharp-win-x64.zip EDSSharp.exe)
          (cd out/portable && zip -qr ../../EDSSharp-portable.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: |
            EDSSharp-linux-x64.tar.gz
            EDSSharp-win-x64.zip
            EDSSharp-portable.zip

  gui1-windows:
    # GUI 1 (WinForms, net481) braucht msbuild und damit einen Windows-Runner.
    needs: vorpruefung
    if: needs.vorpruefung.outputs.exists != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag fuer den Versionsstempel setzen (git describe im Build)
        run: git tag "${{ needs.vorpruefung.outputs.tag }}"
        continue-on-error: true

      - uses: microsoft/setup-msbuild@v3

      - name: Restore
        run: dotnet restore EDSEditorGUI/EDSEditorGUI.csproj

      - name: Build (net481)
        run: msbuild EDSEditorGUI/EDSEditorGUI.csproj /p:BuildNet481=true /p:Configuration=Release

      # Zusaetzlich GUI 1 als moderner net8.0-windows-Build, eigenstaendig
      # (bringt die .NET-8-Desktop-Runtime mit, wie die GUI-2-Pakete).
      - name: Publish net8.0-windows (self-contained, win-x64)
        run: >
          dotnet publish EDSEditorGUI/EDSEditorGUI.csproj -c Release
          -f net8.0-windows -p:BuildNet8=true -r win-x64 --self-contained true
          -o out/gui1-net8

      - name: Artefakte packen
        run: |
          Compress-Archive -CompressionLevel Optimal -Path "EDSEditorGUI\bin\Release\net481\*" -DestinationPath EDSEditorGUI-win-net481.zip
          Compress-Archive -CompressionLevel Optimal -Path "out\gui1-net8\*" -DestinationPath EDSEditorGUI-win-net8.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gui1
          path: |
            EDSEditorGUI-win-net481.zip
            EDSEditorGUI-win-net8.zip

  gui2:
    # GUI 2 (Avalonia, net8.0) laesst sich fuer beide Plattformen von Linux aus bauen.
    needs: vorpruefung
    if: needs.vorpruefung.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag fuer den Versionsstempel setzen (git describe im Build)
        run: git tag "${{ needs.vorpruefung.outputs.tag }}" || true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish linux-x64 (self-contained)
        run: >
          dotnet publish EDSEditorGUI2/EDSEditorGUI2.csproj -c Release
          -r linux-x64 --self-contained true -p:BuildNet8=true -o out/gui2-linux-x64

      - name: Publish win-x64 (self-contained)
        run: >
          dotnet publish EDSEditorGUI2/EDSEditorGUI2.csproj -c Release
          -r win-x64 --self-contained true -p:BuildNet8=true -o out/gui2-win-x64

      # GUI 2 laedt die Geraeteprofile zur Laufzeit aus <Programmordner>/Profiles;
      # dotnet publish nimmt sie nicht selbst mit (das CopyProfilesDirectory-Target
      # im Projekt befuellt nur das Build-, nicht das Publish-Verzeichnis).
      - name: Profiles beilegen
        run: |
          cp -r EDSEditorGUI/Profiles out/gui2-linux-x64/Profiles
          cp -r EDSEditorGUI/Profiles out/gui2-win-x64/Profiles

      - name: Artefakte packen
        run: |
          tar -C out/gui2-linux-x64 -czf EDSEditorGUI2-linux-x64.tar.gz .
          (cd out/gui2-win-x64 && zip -qr ../../EDSEditorGUI2-win-x64.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: gui2
          path: |
            EDSEditorGUI2-linux-x64.tar.gz
            EDSEditorGUI2-win-x64.zip

  release:
    needs: [vorpruefung, cli, gui1-windows, gui2]
    if: needs.vorpruefung.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.vorpruefung.outputs.tag }}
        run: |
          gh release create "$TAG" \
            EDSSharp-linux-x64.tar.gz EDSSharp-win-x64.zip EDSSharp-portable.zip \
            EDSEditorGUI-win-net481.zip EDSEditorGUI-win-net8.zip \
            EDSEditorGUI2-win-x64.zip EDSEditorGUI2-linux-x64.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "CANopenEditor $TAG" \
            --notes "CANopenEditor Komplettpaket: EDSSharp-CLI und beide Oberflaechen.

          Stabile Download-URLs ueber das juengste Release, z.B. fuer die
          CANboss-OD-Generierung (tools/get-edssharp.sh):

              https://github.com/$GITHUB_REPOSITORY/releases/latest/download/EDSSharp-linux-x64.tar.gz

          EDSSharp-linux-x64.tar.gz / EDSSharp-win-x64.zip: Kommandozeilen-Konverter
          (EDS/XDD -> CANopenNode-v4-OD, Proto-JSON u.a.), eigenstaendig - keine
          .NET-Installation noetig. EDSSharp-portable.zip: dito frameworkabhaengig
          (braucht .NET-8-Runtime).

          EDSEditorGUI-win-net481.zip: GUI 1 (klassische WinForms-Oberflaeche,
          EDSEditor.exe). Windows mit .NET Framework 4.8; unter Linux per Mono.

          EDSEditorGUI-win-net8.zip: GUI 1 als net8.0-windows-Build (win-x64),
          eigenstaendig. Laeuft auch unter Wine (wine EDSEditor.exe); die
          DPAPI-Passwortablage nutzt dort den Wine-Prefix.

          EDSEditorGUI2-win-x64.zip / EDSEditorGUI2-linux-x64.tar.gz: GUI 2 (neue
          Avalonia-Oberflaeche), eigenstaendig. EDSEditorGUI2.exe (Windows) bzw.
          ./EDSEditorGUI2 (Linux) starten."
